name: Build Electron Apps
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx electron-builder --win portable
      - uses: actions/upload-artifact@v4
        with:
          name: LagunaCafe-Windows
          path: dist/*.exe
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update -q && sudo apt-get install -y fuse libfuse2
      - run: npm install
      - run: npx electron-builder --linux AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: LagunaCafe-Linux
          path: dist/*.AppImage
  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            LagunaCafe-Windows/*.exe
            LagunaCafe-Linux/*.AppImage
          generate_release_notes: true
