<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍔</text></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | Laguna Food Truck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-body">
<div class="auth-card">
  <div class="auth-logo-circle">🍔</div>
  <h1>Laguna Food Truck</h1>
  <p>Restaurant Management</p>

  <div class="auth-form active" id="loginPanel" style="display:none">
    <div class="input-group">
      <label>اسم المستخدم</label>
      <input type="text" id="username" placeholder="أدخل اسم المستخدم" autocomplete="username">
      <i class="fa-solid fa-user"></i>
    </div>
    <div class="input-group">
      <label>كلمة المرور</label>
      <input type="password" id="password" placeholder="أدخل كلمة المرور" autocomplete="current-password">
      <i class="fa-solid fa-lock"></i>
    </div>
    <button class="auth-submit" id="loginBtn"><i class="fa-solid fa-right-to-bracket"></i> دخول</button>
    <p class="auth-error" id="authError"></p>
  </div>

  <div class="auth-form" id="setupPanel" style="display:none">
    <p style="color:var(--muted);font-size:14px;margin-bottom:22px;line-height:1.8">
      هذه أول مرة تشغيل لنظام المطعم.<br>أنشئ حساب المدير للمتابعة.
    </p>
    <div class="input-group">
      <label>الاسم</label>
      <input type="text" id="setupName" placeholder="مثال: محمد المدير">
      <i class="fa-solid fa-id-card"></i>
    </div>
    <div class="input-group">
      <label>اسم المستخدم</label>
      <input type="text" id="setupUsername" placeholder="اختر اسم مستخدم" autocomplete="username">
      <i class="fa-solid fa-user"></i>
    </div>
    <div class="input-group">
      <label>كلمة المرور</label>
      <input type="password" id="setupPass" placeholder="6 أحرف على الأقل" autocomplete="new-password">
      <i class="fa-solid fa-lock"></i>
    </div>
    <div class="input-group">
      <label>تأكيد كلمة المرور</label>
      <input type="password" id="setupPass2" placeholder="أعد كتابة كلمة المرور" autocomplete="new-password">
      <i class="fa-solid fa-lock"></i>
    </div>
    <button class="auth-submit" id="setupBtn"><i class="fa-solid fa-user-plus"></i> إنشاء الحساب</button>
    <p class="auth-error" id="setupError"></p>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="rt-firebase-config.js"></script>
<script src="js/rt-firebase.js?v=1"></script>
<script src="js/sanitize.js"></script>
<script src="js/password-utils.js"></script>
<script src="js/rt-data.js?v=1"></script>
<script src="js/rt-head.js?v=1"></script>
<script src="js/rt-auth.js?v=1"></script>
</body>
</html>
