<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الإعدادات | Laguna Cafe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/settings.css">
</head>
<body>
<div class="container">
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-circle"><i class="fa-solid fa-mug-hot"></i></div>
      <h2>Laguna Cafe</h2>
      <p>Cafe & Restaurant</p>
    </div>
    <nav>
      <a href="index.html"><i class="fa-solid fa-chart-line"></i><span>لوحة التحكم</span></a>
      <a href="menu.html"><i class="fa-solid fa-utensils"></i><span>المنيو</span></a>
      <a href="invoices.html"><i class="fa-solid fa-file-invoice"></i><span>الفواتير</span></a>
      <a href="returns.html"><i class="fa-solid fa-arrow-rotate-left"></i><span>المرتجعات</span></a>
      <a href="employees.html" class="admin-only"><i class="fa-solid fa-users"></i><span>الموظفين</span></a>
      <a href="attendance.html"><i class="fa-solid fa-calendar-check"></i><span>الحضور</span></a>
      <a href="tables.html"><i class="fa-solid fa-table-cells-large"></i><span>الترابيزات</span></a>
      <a href="inventory.html" class="admin-only"><i class="fa-solid fa-boxes-stacked"></i><span>المخزون</span></a>
      <a href="expenses.html" class="admin-only"><i class="fa-solid fa-money-bill-transfer"></i><span>المصروفات</span></a>
      <a href="customers.html" class="admin-only"><i class="fa-solid fa-user-group"></i><span>العملاء</span></a>
      <a href="reports.html" class="admin-only"><i class="fa-solid fa-chart-simple"></i><span>التقارير</span></a>
      <a href="qr.html"><i class="fa-solid fa-qrcode"></i><span>QR Code</span></a>
      <a href="settings.html" class="active admin-only"><i class="fa-solid fa-gear"></i><span>الإعدادات</span></a>
    </nav>
  </aside>
  <main class="main">
    <div class="page-header">
      <div>
        <h1><i class="fa-solid fa-gear"></i>الإعدادات</h1>
        <p>إعدادات نظام Laguna Cafe</p>
      </div>
    </div>
    <section class="settings-grid">
      <div class="settings-card">
        <h3><i class="fa-solid fa-shop"></i>معلومات المطعم</h3>
        <label>اسم المطعم</label>
        <input type="text" id="cafeName">
        <label>العملة</label>
        <select id="currency">
          <option value="ج.م">ج.م (جنيه مصري)</option>
          <option value="$">$ (دولار)</option>
          <option value="€">€ (يورو)</option>
        </select>
      </div>
      <div class="settings-card">
        <h3><i class="fa-solid fa-percentage"></i>الضرائب والتنبيهات</h3>
        <label>نسبة الضريبة (%)</label>
        <input type="number" id="taxRate" min="0" max="100">
        <label>تنبيه المخزون المنخفض (أقل من)</label>
        <input type="number" id="lowStockAlert" min="0">
      </div>
      <div class="settings-card">
        <h3><i class="fa-solid fa-user-shield"></i>إدارة الحسابات</h3>
        <label>اسم المستخدم الجديد</label>
        <input type="text" id="newUsername" placeholder="اسم المستخدم">
        <label>كلمة المرور</label>
        <input type="password" id="newPassword" placeholder="كلمة المرور">
        <label>الاسم الكامل</label>
        <input type="text" id="newFullName" placeholder="الاسم الكامل">
        <label>الصلاحية</label>
        <select id="newRole">
          <option value="Administrator">مدير</option>
          <option value="Employee">موظف</option>
        </select>
        <button class="add-btn" id="addUserBtn"><i class="fa-solid fa-user-plus"></i>إضافة حساب</button>
      </div>
    </section>
    <div class="settings-actions">
      <button class="save-settings" id="saveSettings"><i class="fa-solid fa-floppy-disk"></i>حفظ الإعدادات</button>
      <button class="reset-btn" id="resetData"><i class="fa-solid fa-trash-can"></i>مسح كل البيانات</button>
    </div>
  </main>
</div>
<script src="js/supabase-client.js"></script>
<script src="js/api-client.js"></script>
<script src="js/data.js"></script>
<script src="js/settings.js"></script>
<script>if (!sessionStorage.getItem('laguna_user')) window.location.href = 'auth.html';</script>
<script src="js/role.js"></script>
</body>
</html>
