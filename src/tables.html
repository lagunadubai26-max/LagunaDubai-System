<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الترابيزات | Laguna Cafe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/tables.css">
</head>
<body>
<div class="container">
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-circle"><i class="fa-solid fa-mug-hot"></i></div>
      <h2>Laguna Cafe</h2>
      <p>Cafe & Restaurant</p>
    </div>
    <nav>
      <a href="index.html"><i class="fa-solid fa-chart-line"></i><span>لوحة التحكم</span></a>
      <a href="menu.html"><i class="fa-solid fa-utensils"></i><span>المنيو</span></a>
      <a href="invoices.html"><i class="fa-solid fa-file-invoice"></i><span>الفواتير</span></a>
      <a href="returns.html"><i class="fa-solid fa-arrow-rotate-left"></i><span>المرتجعات</span></a>
      <a href="attendance.html"><i class="fa-solid fa-calendar-check"></i><span>الحضور</span></a>
      <a href="tables.html" class="active"><i class="fa-solid fa-table-cells-large"></i><span>الترابيزات</span></a>
      <a href="inventory.html" class="admin-only"><i class="fa-solid fa-boxes-stacked"></i><span>المخزون</span></a>
      <a href="expenses.html" class="admin-only"><i class="fa-solid fa-money-bill-transfer"></i><span>المصروفات</span></a>
      <a href="customers.html" class="admin-only"><i class="fa-solid fa-user-group"></i><span>العملاء</span></a>
      <a href="reports.html" class="admin-only"><i class="fa-solid fa-chart-simple"></i><span>التقارير</span></a>
      <a href="qr.html"><i class="fa-solid fa-qrcode"></i><span>QR Code</span></a>
      <a href="settings.html" class="admin-only"><i class="fa-solid fa-gear"></i><span>الإعدادات</span></a>
    </nav>
  </aside>
  <main class="main">
    <div class="page-header">
      <div>
        <h1><i class="fa-solid fa-table-cells-large"></i>الترابيزات</h1>
        <p>إدارة طاولات Laguna Cafe</p>
      </div>
    </div>
    <section class="tables-stats">
      <div class="stat-card"><i class="fa-solid fa-table-cells-large"></i><div><h2 id="totalTables">12</h2><span>إجمالي الطاولات</span></div></div>
      <div class="stat-card"><i class="fa-solid fa-circle-check"></i><div><h2 id="availableTables">0</h2><span>متاحة</span></div></div>
      <div class="stat-card"><i class="fa-solid fa-chair"></i><div><h2 id="occupiedTables">0</h2><span>مشغولة</span></div></div>
      <div class="stat-card"><i class="fa-solid fa-wrench"></i><div><h2 id="reservedTables">0</h2><span>محجوزة</span></div></div>
    </section>
    <div class="tables-tools">
      <button class="add-btn" id="addTableBtn"><i class="fa-solid fa-plus"></i>إضافة طاولة</button>
    </div>
    <section class="tables-grid" id="tablesGrid"></section>
    <div class="modal" id="tableModal">
      <div class="modal-box">
        <div class="modal-header">
          <h2 id="modalTitle">إضافة طاولة</h2>
          <button class="close-modal" id="closeTableModal"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="modal-body">
          <label>اسم الطاولة</label>
          <input type="text" id="tableName" placeholder="مثال: طاولة 1">
          <label>عدد الكراسي</label>
          <input type="number" id="tableCapacity" placeholder="4" min="1">
        </div>
        <div class="modal-footer">
          <button class="cancel-btn" id="cancelTable">إلغاء</button>
          <button class="confirm-btn" id="saveTable">حفظ</button>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="js/supabase-client.js"></script>
<script src="js/api-client.js"></script>
<script src="js/data.js"></script>
<script src="js/tables.js"></script>
<script>if (!sessionStorage.getItem('laguna_user')) window.location.href = 'auth.html';</script>
<script src="js/role.js"></script>
</body>
</html>
