<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☕</text></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | Laguna Dubai</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-body">
<div class="auth-card">
  <div class="auth-logo-circle"><img src="images/logo.png" alt="Laguna Dubai" style="width:56px;height:56px;border-radius:50%"></div>
  <h1>Laguna Dubai</h1>
  <p>Cafe &amp; Restaurant Management</p>
  <div class="auth-tabs">
    <button class="auth-tab active" data-tab="admin">دخول المدير</button>
    <button class="auth-tab" data-tab="employee">دخول الموظف</button>
  </div>
  <div class="auth-form active" id="adminForm">
    <div class="input-group">
      <label>اسم المستخدم</label>
      <input type="text" id="username" placeholder="أدخل اسم المستخدم">
      <i class="fa-solid fa-user"></i>
    </div>
    <div class="input-group">
      <label>كلمة المرور</label>
      <input type="password" id="password" placeholder="أدخل كلمة المرور">
      <i class="fa-solid fa-lock"></i>
    </div>
    <button class="auth-submit" id="loginBtn"><i class="fa-solid fa-right-to-bracket"></i> دخول</button>
    <p class="auth-error" id="authError"></p>
  </div>
  <div class="auth-form" id="employeeForm">
    <div class="input-group">
      <label>اختر اسمك</label>
      <select id="employeeSelect" style="width:100%;height:48px;border:2px solid var(--border);border-radius:12px;padding:0 16px;font-size:15px;font-family:inherit;outline:none;background:#fafaf9">
        <option value="">— اختر اسمك —</option>
      </select>
      <i class="fa-solid fa-user"></i>
    </div>
    <div class="input-group">
      <label>الرقم السري</label>
      <input type="password" id="employeePin" placeholder="أدخل الرقم السري" maxlength="4">
      <i class="fa-solid fa-lock"></i>
    </div>
    <button class="auth-submit" id="empLoginBtn"><i class="fa-solid fa-right-to-bracket"></i> دخول</button>
    <p class="auth-error" id="empAuthError"></p>
  </div>
</div>
<script src="js/supabase-client.js?v=3"></script>
<script src="js/api-client.js?v=3"></script>
<script src="js/data.js?v=3"></script>
<script src="js/auth.js"></script>
</body>
</html>
