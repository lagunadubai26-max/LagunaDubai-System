<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | Laguna Cafe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
<div class="auth-container">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="auth-logo-circle"><i class="fa-solid fa-mug-hot"></i></div>
      <h1>Laguna Cafe</h1>
      <p>Cafe & Restaurant Management</p>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="admin">دخول المدير</button>
      <button class="auth-tab" data-tab="employee">دخول الموظف</button>
    </div>
    <div class="auth-form" id="adminForm">
      <h2>تسجيل دخول المدير</h2>
      <div class="input-group">
        <i class="fa-solid fa-user"></i>
        <input type="text" id="username" placeholder="اسم المستخدم">
      </div>
      <div class="input-group">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="password" placeholder="كلمة المرور">
      </div>
      <button id="loginBtn"><i class="fa-solid fa-right-to-bracket"></i>دخول</button>
      <p class="auth-error" id="authError"></p>
      <p class="auth-hint">الحساب الافتراضي: admin / admin123</p>
    </div>
    <div class="auth-form" id="employeeForm" style="display:none">
      <h2>تسجيل دخول الموظف</h2>
      <div class="input-group">
        <i class="fa-solid fa-user"></i>
        <select id="employeeSelect" style="width:100%;height:55px;border:none;background:transparent;font-family:'Cairo',sans-serif;font-size:16px;outline:none;padding-right:12px;color:#555">
          <option value="">اختر اسمك</option>
        </select>
      </div>
      <div class="input-group">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="employeePin" placeholder="الرقم السري" maxlength="4">
      </div>
      <button id="empLoginBtn"><i class="fa-solid fa-right-to-bracket"></i>دخول</button>
      <p class="auth-error" id="empAuthError"></p>
    </div>
  </div>
</div>
<script src="js/supabase-client.js"></script>
<script src="js/api-client.js"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
