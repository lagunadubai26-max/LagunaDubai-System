services:
  - type: web
    name: laguna-cafe
    runtime: node
    repo: https://github.com/YOUR_USERNAME/laguna-cafe
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
