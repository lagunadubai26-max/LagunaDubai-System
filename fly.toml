# fly.toml - Laguna Cafe on Fly.io
app = 'lagunadubai-system'
primary_region = 'fra'

[[mounts]]
  source = 'data'
  destination = '/data'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'

[env]
  JWT_SECRET = 'laguna-secret-2026'
  DB_PATH = '/data/laguna.db'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
